<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta's Hub</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link href="./style.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body class="main">
    <header class="hub-header">
      <h1 class="white"><span>Deltanoid's Hub</span></h1>  
      <div class="controls">
        <button class="btn-toggle" onclick="toggleGradient()">Theme</button>
      </div>
    </header>

    <main class="dashboard">

      <!-- usefull links -->
      <section class="widget">
        <h2>Usefull Links</h2>
        <ul>
          <li><a class="white" href="https://www.youtube.com/watch?v=fs_Z66-d774">Valve Sus</a></li>
          <li><a class="white" href="https://docs.google.com/document/d/1qKfOtOXpYormusD05I700P8d79E74R1bTb3MP4vum-E/edit#heading=h.p6xizipivwq8">Hollow Knight Skins</a></li>  
        </ul>
      </section>
    
      <!-- spotify thing -->
      <section class="widget">
        <h2>Music</h2>
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/3huY1HtfehmXUfHMocauAo?utm_source=generator" width="100%" height="360" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        <p> 751 Songs as of 19/10/2024</p>
        <p> 781 Songs as of 10/11/2026</p>
      </section>
    
      <!-- aku + ur mom -->
      <section class="widget">
        <h2>ㅤ</h2>
        <div class="image-row">
          <img src="./images/Aku.jpg" alt="Aku">
        </div>
        <p><strong>Ur Mom</strong></p>
      </section>

      <!-- cat -->
      <section class="widget">
        <h2>CATS!</h2>
        <div class="image-row">
          <img src="https://cataas.com/cat/cute" alt="Cute Cat">
        </div>
      </section>

    </main>
    
    <footer class="hub-footer">
      <p class="note">Reminder to "control + f5" to refresh page cache every now and then</p>
    </footer>

    <script>
      function toggleGradient() {
          // Toggles the 'alt-gradient' class on the body tag
          document.body.classList.toggle('alt-gradient');
      }
    </script>
  </body>
</html>
